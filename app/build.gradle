plugins {
    id 'com.android.application'
}

android {
    namespace 'com.magic76.aiclicker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.magic76.aiclicker'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '0.18.1-filament-visibility'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Native GPU renderer for the Living Canvas.
    implementation 'com.google.android.filament:filament-android:1.75.1'
    implementation 'com.google.android.filament:gltfio-android:1.75.1'
}
