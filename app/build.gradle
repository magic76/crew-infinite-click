plugins {
    id 'com.android.application'
}

android {
    namespace 'com.magic76.aiclicker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.magic76.aiclicker'
        minSdk 26
        targetSdk 35
        versionCode 412
        // v30.4 marker versionCode 411
        // v30.3 marker versionCode 410
        // v30.2 marker versionCode 409
        // v30 marker versionCode 408
        // v29 marker versionCode 407
        // v28 marker versionCode 406
        // v27 marker versionCode 405
        // v26 marker versionCode 404
        // legacy marker versionCode 395
        versionName '0.62.0-impact-pass-v30-5'
        // v30.4 marker versionName '0.61.0-tap-rush-v30-4'
        // v30.3 marker versionName '0.60.1-core-throttle-v30-3'
        // v30.2 marker versionName '0.60.0-excitement-pet-v30-2'
        // v30 marker versionName '0.59.0-dual-trigger-v30'
        // v29 marker versionName '0.58.0-tension-release-v29'
        // v28 marker versionName '0.57.0-run-evolution-v28'
        // v27 marker versionName '0.56.0-endless-chaos-v27'
        // v26 marker versionName '0.55.0-visible-shooting-v26'
        // legacy marker versionName '0.46.0-asset-art-v17'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

