plugins {
    id 'com.android.application'
}

android {
    namespace 'com.magic76.aiclicker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.magic76.aiclicker'
        minSdk 26
        targetSdk 35
        versionCode 396
        // legacy marker versionCode 395
        versionName '0.47.0-production-asset-v18'
        // legacy marker versionName '0.46.0-asset-art-v17'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
